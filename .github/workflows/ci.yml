name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default: the quality jobs only read the repository.
# The publish job re-grants exactly what it needs (packages: write).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @zenport/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: ZP_SESSION_SECRET=ci-only docker compose config -q
      - name: Build image
        run: docker build -t zenport-ci .

  # Publishing lives in this workflow, not one of its own, so a release tag
  # can never publish from a commit whose checks did not pass.
  publish:
    needs: [checks, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ilankushnir/zenport
    steps:
      - uses: actions/checkout@v4
      - name: Derive SemVer from the tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not a SemVer release tag"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build release image
        run: docker build -t "$IMAGE:${{ steps.ver.outputs.version }}" .
      - name: Health smoke on the exact release image
        run: |
          docker run -d --name smoke -p 8484:8484 \
            -e ZP_SESSION_SECRET=ci-smoke-secret-0123456789abcdef \
            -e ZP_SETUP_TOKEN=ci-smoke-setup-token \
            "$IMAGE:${{ steps.ver.outputs.version }}"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8484/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { docker logs smoke; exit 1; }
          # The claim gate answers, and the token set above is enforced.
          curl -fsS http://127.0.0.1:8484/api/setup/status \
            | grep -q '"needsSetup":true' || { docker logs smoke; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8484/api/setup \
            -H 'content-type: application/json' -H 'x-zenport-csrf: 1' \
            -d '{"username":"admin","password":"smoke-password-123"}')
          [ "$code" = "403" ] || { echo "tokenless setup returned $code"; exit 1; }
          docker rm -f smoke
      # GITHUB_TOKEN via the login action — no plaintext credentials, and the
      # token only carries the packages: write this job asked for.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the immutable SemVer tag (v0.1.0 -> 0.1.0), which is what KWS
      # pins. No moving tags: each release lives at exactly one reference.
      - name: Publish immutable tag
        run: docker push "$IMAGE:${{ steps.ver.outputs.version }}"
