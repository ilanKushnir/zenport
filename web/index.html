<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181420" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ZenPort — a calm, self-hosted home for the meditation library you already own."
    />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      "black", not "black-translucent": on iOS 26 a Home Screen app drawn under
      a translucent status bar is sized one status bar short of the screen's
      bottom, and that strip cannot be painted - the tab bar floats above an
      empty band. Below a plain status bar the page reaches the bottom edge.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ZenPort" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ZenPort</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
